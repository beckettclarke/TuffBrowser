name: TuffBrowser
options:
  bundleIdPrefix: ca.beckettclarke
  deploymentTarget:
    macOS: "15.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES
    # Apple Silicon only: a universal build doubles the executable for Intel Macs.
    ARCHS: arm64

targets:
  TuffBrowser:
    type: application
    platform: macOS
    sources:
      - path: TuffBrowser
    scheme:
      testTargets:
        - TuffBrowserTests
    info:
      path: TuffBrowser/Resources/Info.plist
      properties:
        CFBundleName: Tuff
        CFBundleDisplayName: Tuff
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSHumanReadableCopyright: ""
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: A website you opened in Tuff wants to use your camera.
        NSMicrophoneUsageDescription: A website you opened in Tuff wants to use your microphone.
        NSLocationUsageDescription: A website you opened in Tuff wants to use your location.
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [http, https]
          - CFBundleURLName: BitTorrent magnet link
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [magnet]
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSItemContentTypes: [public.html, public.xhtml]
          - CFBundleTypeName: BitTorrent file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.bittorrent.torrent]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.bittorrent.torrent
            UTTypeDescription: BitTorrent file
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [torrent]
              public.mime-type: [application/x-bittorrent]
    entitlements:
      path: TuffBrowser/Resources/TuffBrowser.entitlements
      properties:
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.beckettclarke.TuffBrowser
        PRODUCT_NAME: Tuff
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          # Its own identity, so a Debug build never shares WebKit storage (including
          # extension state such as a signed-in 1Password) with a Release build running beside it.
          PRODUCT_BUNDLE_IDENTIFIER: ca.beckettclarke.TuffBrowser.debug
          ENABLE_HARDENED_RUNTIME: NO
          SWIFT_OPTIMIZATION_LEVEL: -Onone
        Release:
          # scripts/release.sh turns the hardened runtime on when you sign with a Developer ID,
          # which notarization requires.
          ENABLE_HARDENED_RUNTIME: NO
          SWIFT_OPTIMIZATION_LEVEL: -O
          SWIFT_COMPILATION_MODE: wholemodule
          STRIP_INSTALLED_PRODUCT: YES
          COPY_PHASE_STRIP: YES
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_STYLE: non-global

  TuffBrowserTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TuffBrowserTests
    dependencies:
      - target: TuffBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.beckettclarke.TuffBrowserTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tuff.app/Contents/MacOS/Tuff"
        BUNDLE_LOADER: "$(TEST_HOST)"
